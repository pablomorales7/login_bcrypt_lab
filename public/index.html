<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Evaluación - bcrypt">
  <title>Examen 1P</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="login-card" aria-labelledby="page-title">
      <div class="brand-mark" aria-hidden="true">SL</div>
      <p class="eyebrow">EXAMEN FINAL - PRIMER PARCIAL</p>
      <h1 id="page-title">LoginSeguro</h1>
      <p class="subtitle">Registro e inicio de sesión con contraseñas protegidas mediante bcrypt.</p>

      <div class="tabs" role="tablist" aria-label="Tipo de operación">
        <button class="tab active" id="tab-login" role="tab" aria-selected="true" aria-controls="login-panel" type="button">Iniciar sesión</button>
        <button class="tab" id="tab-register" role="tab" aria-selected="false" aria-controls="register-panel" type="button">Crear cuenta</button>
      </div>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

      <form id="login-panel" class="auth-form" autocomplete="on">
        <label for="login-user">Usuario</label>
        <input id="login-user" name="user" type="text" minlength="3" maxlength="30" autocomplete="username" placeholder="Ingrese su usuario" required>
        <label for="login-password">Contraseña</label>
        <input id="login-password" name="password" type="password" minlength="8" maxlength="72" autocomplete="current-password" placeholder="Ingrese su contraseña" required>
        <button class="primary-button" type="submit">Ingresar</button>
      </form>

      <form id="register-panel" class="auth-form" hidden>
        <label for="register-user">Nuevo usuario</label>
        <input id="register-user" name="user" type="text" minlength="3" maxlength="30" autocomplete="username" placeholder="Cree un nombre de usuario" required>
        <label for="register-password">Contraseña</label>
        <input id="register-password" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
        <label for="register-confirm">Confirmar contraseña</label>
        <input id="register-confirm" name="confirm" type="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Repita la contraseña" required>
        <button class="primary-button" type="submit">Crear cuenta</button>
      </form>

      <p class="footnote"><span class="status-dot"></span> Entorno de práctica · Los usuarios se almacenan temporalmente en memoria.</p>
    </section>
    <footer>Examen Primer Parcial · Ingeniería de la Seguridad del Software</footer>
  </main>
</body>
</html>
